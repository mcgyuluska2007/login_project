<main class="login-page d-flex align-items-center justify-content-center min-vh-100">
  <section class="login-card card shadow-sm">
    <div class="card-body p-4">
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" novalidate>
        <header class="text-center mb-4">
          <h2 class="fw-bold mb-0">Member Login</h2>
          <p class="text-muted small mt-1">Sign in to your account</p>
        </header>

        <div class="mb-3">
          <label for="email" class="form-label">Email</label>
          <input
            type="email"
            id="email"
            class="form-control"
            formControlName="email"
            placeholder="you@example.com"
            [class.is-invalid]="isInvalid('email')"
          >
          <div class="invalid-feedback" *ngIf="isInvalid('email')">
            <span *ngIf="email.errors?.['required']">Email is required.</span>
            <span *ngIf="email.errors?.['email']">Enter a valid email address.</span>
          </div>
        </div>

        <div class="mb-3">
          <label for="password" class="form-label">Password</label>
          <input
            type="password"
            id="password"
            class="form-control"
            formControlName="password"
            placeholder="Password"
            [class.is-invalid]="isInvalid('password')"
          >
          <div class="invalid-feedback" *ngIf="isInvalid('password')">
            <span *ngIf="password.errors?.['required']">Password is required.</span>
            <span *ngIf="password.errors?.['minlength']">Password must be at least 6 characters.</span>
          </div>
        </div>

        <button type="submit" class="btn btn-primary w-100 mt-2">Submit</button>
      </form>
    </div>
  </section>
</main>
